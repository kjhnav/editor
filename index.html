<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>나만의 HTML 에디터</title>
  <!-- jsDelivr CDN으로 변경 -->
  <link rel="stylesheet" href="https://jsdelivr.net">
  <link rel="stylesheet" href="https://jsdelivr.net">
  <link rel="stylesheet" href="https://jsdelivr.net">
  
  <style>
    body { margin: 0; display: flex; flex-direction: column; height: 100vh; font-family: sans-serif; }
    header { 
      background: #282a36; color: white; padding: 10px 20px; 
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid #44475a;
    }
    button {
      background: #50fa7b; color: #282a36; border: none; padding: 8px 16px;
      font-weight: bold; border-radius: 4px; cursor: pointer; font-size: 14px;
    }
    button:hover { background: #40e068; }
    textarea { flex: 1; font-size: 16px; padding: 10px; border: none; outline: none; }
    .CodeMirror { flex: 1; font-size: 16px; height: 100%; }
  </style>
</head>
<body>

  <header>
    <div><strong>HTML 에디터</strong> (줄 번호 옆 화살표로 코드 접기 가능)</div>
    <button onclick="openPreview()">새 창으로 결과 보기 ▶</button>
  </header>

  <textarea id="editor"><!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    h1 { color: #0070f3; }
  </style>
</head>
<body>
  <h1>안녕하세요!</h1>
  <p>왼쪽 줄 번호 옆의 ▼ 버튼을 누르면 태그나 중괄호({})를 접을 수 있습니다.</p>
</body>
</html></textarea>

  <!-- CodeMirror 핵심 및 부가기능 스크립트 (jsDelivr) -->
  <script src="https://jsdelivr.net"></script>
  <script src="https://jsdelivr.net"></script>
  <script src="https://jsdelivr.net"></script>
  <script src="https://jsdelivr.net"></script>
  <script src="https://jsdelivr.net"></script>
  
  <script src="https://jsdelivr.net"></script>
  <script src="https://jsdelivr.net"></script>
  <script src="https://jsdelivr.net"></script>
  <script src="https://jsdelivr.net"></script>
  <script src="https://jsdelivr.net"></script>

  <script>
    let editor = null;

    // CodeMirror가 정상 로드되었을 때만 실행 (에러 방지)
    if (typeof CodeMirror !== "undefined") {
      editor = CodeMirror.fromTextArea(document.getElementById("editor"), {
        mode: "htmlmixed",
        theme: "dracula",
        lineNumbers: true,
        autoCloseTags: true,
        indentUnit: 2,
        smartIndent: true,
        foldGutter: true,
        gutters: ["CodeMirror-linenumbers", "CodeMirror-foldgutter"]
      });
    } else {
      alert("에디터 스타일 라이브러리 로딩이 차단되었습니다. 브라우저 확장 프로그램이나 네트워크를 확인해주세요.");
    }

    // 새 창 열어서 결과물 렌더링
    function openPreview() {
      const code = editor ? editor.getValue() : document.getElementById("editor").value;
      const newWindow = window.open("", "_blank");
      if (newWindow) {
        newWindow.document.open();
        newWindow.document.write(code);
        newWindow.document.close();
      } else {
        alert("브라우저에서 팝업이 차단되었습니다. 주소창 오른쪽의 팝업 차단을 해제해주세요!");
      }
    }
  </script>
</body>
</html>
