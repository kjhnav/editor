<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>나만의 HTML 에디터</title>
  <!-- CodeMirror 기본 스타일 및 다크 테마 -->
  <link rel="stylesheet" href="https://cloudflare.com">
  <link rel="stylesheet" href="https://cloudflare.com">
  <!-- 코드 접기(줄여쓰기) 스타일 -->
  <link rel="stylesheet" href="https://cloudflare.com">
  
  <style>
    body { margin: 0; display: flex; flex-direction: column; height: 100vh; font-family: sans-serif; }
    header { 
      background: #282a36; color: white; padding: 10px 20px; 
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid #44475a;
    }
    button {
      background: #50fa7b; color: #282a36; border: none; padding: 8px 16px;
      font-weight: bold; border-radius: 4px; cursor: pointer; font-size: 14px;
    }
    button:hover { background: #40e068; }
    .CodeMirror { flex: 1; font-size: 16px; }
  </style>
</head>
<body>

  <header>
    <div><strong>HTML 에디터</strong> (줄 번호 옆 화살표로 코드 접기 가능)</div>
    <button onclick="openPreview()">새 창으로 결과 보기 ▶</button>
  </header>

  <textarea id="editor"><!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    h1 { color: #0070f3; }
  </style>
</head>
<body>
  <h1>안녕하세요!</h1>
  <p>왼쪽 줄 번호 옆의 ▼ 버튼을 누르면 태그를 접을 수 있습니다.</p>
</body>
</html></textarea>

  <!-- CodeMirror 핵심 스크립트 -->
  <script src="https://cloudflare.com"></script>
  <!-- HTML/CSS/JS 문법 지원 -->
  <script src="https://cloudflare.com"></script>
  <script src="https://cloudflare.com"></script>
  <script src="https://cloudflare.com"></script>
  <script src="https://cloudflare.com"></script>
  
  <!-- 자동 닫기 & 코드 접기(줄여쓰기) 부가기능 -->
  <script src="https://cloudflare.com"></script>
  <script src="https://cloudflare.com"></script>
  <script src="https://cloudflare.com"></script>
  <script src="https://cloudflare.com"></script>

  <script>
    // 에디터 초기화 및 옵션 설정
    const editor = CodeMirror.fromTextArea(document.getElementById("editor"), {
      mode: "htmlmixed",       // HTML + CSS + JS 통합 모드
      theme: "dracula",        // 어두운 테마
      lineNumbers: true,       // 줄 번호 표시
      autoCloseTags: true,     // 여는 태그 입력 시 닫는 태그 자동 생성
      indentUnit: 2,           // 자동 들여쓰기 간격 (2칸)
      smartIndent: true,       // 문맥에 맞는 스마트 자동 들여쓰기
      foldGutter: true,        // 코드 접기(줄여쓰기) 활성화
      gutters: ["CodeMirror-linenumbers", "CodeMirror-foldgutter"]
    });

    // 새 창 열어서 결과물 렌더링
    function openPreview() {
      const code = editor.getValue();
      const newWindow = window.open("", "_blank");
      newWindow.document.open();
      newWindow.document.write(code);
      newWindow.document.close();
    }
  </script>
</body>
</html>
